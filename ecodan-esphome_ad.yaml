substitutions:
  name: ecodan-ad
  friendlyName: Ecodan heatpump

# enable ota update via http request
http_request:
  buffer_size_tx: 20248

ota:
  - platform: esphome
  - platform: http_request
  - platform: web_server
#  password: !secret heatpump_ota_password

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Amsterdam
    servers:
     - 0.pool.ntp.org
     - 1.pool.ntp.org
     - 2.pool.ntp.org

wireguard:
  address: 192.168.10.202
  private_key: !secret wg_ad_privkey
  peer_endpoint: "0pnolvf2nxv8pjso.myfritz.net"
  peer_public_key: "Jkhh1Rlk5FX1/t40k6DG+M5QL+IeK5sWl4piFmZ6CgY="

  # Optional netmask (this is the default, no outgoing traffic
  # will pass through the tunnel if omitted)
  netmask: 255.255.255.0

  # Optional endpoint port (WireGuard default if omitted)
  peer_port: 55911

  # Optional pre-shared key (omit if not in use)
  peer_preshared_key: !secret wg_ad_shrdkey

  # Optional list of ip/mask (any host is allowed if omitted)
  peer_allowed_ips:
    - 192.168.10.0/24
    - 0.0.0.0/0

  # Optional keepalive (disabled by default)
  peer_persistent_keepalive: 25s

mqtt:
  broker: 192.168.10.12
  discover_ip: true
  discovery: true
  username: mqttuser
  password: !secret mqtt_password
  #topic_prefix : ecodan-tom

#api:
#  reboot_timeout: 0s
#  encryption:
#    key: !secret heatpump_encryption_key

# uncomment if you have multiple esp running
#esphome:
  #name_add_mac_suffix: true
  # this setting does not work as debug is occuring in ecodan. Better use topic prefix ecodan-tome

external_components:
- source:
    type: local
    path: components
  components: [ ecodan ]
      
