# Enable Web server.
web_server:
  port: 80
  local: true
  #ota: true

ecodan:
  id: ecodan_instance
  uart_id: uart_ecodan
# polling interval override in ms, default 500
#  polling_interval_override: 1000
# uncomment line below and adjust the heat constant if your system uses a water + glycol mixture
#  specific_heat_constant_override: 3.9

wifi:
  ssid: !secret wifi_ad_ssid
  password: !secret wifi_ad_password
  power_save_mode: high
  reboot_timeout: 0s
  ap:
    ssid: "${name}"
    password: "configesp"
    ap_timeout: 15s

<<: !include confs/wifi-base.yaml